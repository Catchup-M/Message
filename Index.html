<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Telegram UI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: #0d1117; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; }
  .tabs::-webkit-scrollbar { display: none; }

  /* Screens */
  #app { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  #screen-chat-list { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.3s ease; }
  #screen-chat-view { position: absolute; top: 0; left: 100%; width: 100%; height: 100%; transition: transform 0.3s ease; background: #0d1117; }
  body.in-chat #screen-chat-list { transform: translateX(-100%); }
  body.in-chat #screen-chat-view { transform: translateX(-100%); }
</style>
</head>
<body>

<div id="app">
<!-- ═══════════════════════════════════ SCREEN 1: CHAT LIST ═══════════════════════════════════ -->
<div id="screen-chat-list">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 8px 16px 20px; background:#1a1f2e;">
    <h1 style="font-size:24px; font-weight:600;">Chats</h1>
    <button style="width:44px; height:44px; border-radius:50%; background:transparent; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8e96a3;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs" style="display:flex; gap:24px; padding:12px 20px 0; background:#1a1f2e; overflow-x:auto; border-bottom:1px solid #2a2f3e;">
    <div onclick="setTab('all')" id="tab-all" style="position:relative; padding-bottom:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
      <span style="font-size:15px; font-weight:500; color:#fff; white-space:nowrap;">All</span>
      <div id="bar-all" style="position:absolute; bottom:-1px; left:0; right:0; height:4px; background:#2a9ef1; border-radius:4px 4px 0 0;"></div>
    </div>
    <div onclick="setTab('new')" id="tab-new" style="position:relative; padding-bottom:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
      <span id="label-new" style="font-size:15px; font-weight:400; color:#8e96a3; white-space:nowrap;">New</span>
      <span style="background:#2a9ef1; color:#fff; border-radius:10px; padding:1px 6px; font-size:13px; font-weight:600; min-width:20px; text-align:center;">1</span>
      <div id="bar-new" style="display:none; position:absolute; bottom:-1px; left:0; right:0; height:4px; background:#2a9ef1; border-radius:4px 4px 0 0;"></div>
    </div>
    <div onclick="setTab('family')" id="tab-family" style="position:relative; padding-bottom:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
      <span id="label-family" style="font-size:15px; font-weight:400; color:#8e96a3; white-space:nowrap;">❤️ Семья</span>
      <div id="bar-family" style="display:none; position:absolute; bottom:-1px; left:0; right:0; height:4px; background:#2a9ef1; border-radius:4px 4px 0 0;"></div>
    </div>
    <div onclick="setTab('channels')" id="tab-channels" style="position:relative; padding-bottom:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
      <span id="label-channels" style="font-size:15px; font-weight:400; color:#8e96a3; white-space:nowrap;">Каналы</span>
      <span style="background:#2a2f3e; color:#8e96a3; border-radius:10px; padding:1px 6px; font-size:13px; font-weight:600; min-width:20px; text-align:center;">5</span>
      <div id="bar-channels" style="display:none; position:absolute; bottom:-1px; left:0; right:0; height:4px; background:#2a9ef1; border-radius:4px 4px 0 0;"></div>
    </div>
  </div>

  <!-- Chat List -->
  <div style="margin-bottom:80px;">
    <div id="content-all">
      <div onclick="openChat()" id="chat-row" style="display:flex; align-items:center; padding:12px 20px; gap:14px; cursor:pointer; position:relative; transition: background 0.15s;">
        <div style="width:54px; height:54px; border-radius:50%; background:#2a2f3e; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:2px dashed #3a4050;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a5060" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
          </svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="font-size:16px; font-weight:600; color:#fff;">Арина Громова</span>
            <div style="display:flex; align-items:center; gap:4px; flex-shrink:0; margin-left:8px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24">
                <path fill="#8e96a3" d="M16.729 4.271a1 1 0 0 0-1.414-.004a1.004 1.004 0 0 0-.225.355c-.832 1.736-1.748 2.715-2.904 3.293C10.889 8.555 9.4 9 7 9a1.006 1.006 0 0 0-.923.617a1.001 1.001 0 0 0 .217 1.09l3.243 3.243L5 20l6.05-4.537l3.242 3.242a.975.975 0 0 0 .326.217c.122.051.252.078.382.078s.26-.027.382-.078A.996.996 0 0 0 16 18c0-2.4.444-3.889 1.083-5.166c.577-1.156 1.556-2.072 3.293-2.904a.983.983 0 0 0 .354-.225a1 1 0 0 0-.004-1.414l-3.997-4.02z"/>
              </svg>
              <span style="font-size:13px; color:#8e96a3;">15:04</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:2px; min-width:0;">
            <span style="font-size:14px; color:#8e96a3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;">
              Что за трек ты включала на вечеринке? Дай название 🙏
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 32 32" style="flex-shrink:0;">
              <path fill="none" stroke="#8ccded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m4 17l5 5l12-12m-5 10l2 2l12-12"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <div id="content-new" style="display:none; padding:40px 20px; text-align:center; color:#8e96a3;"><p style="font-size:15px;">No new messages</p></div>
    <div id="content-family" style="display:none; padding:40px 20px; text-align:center; color:#8e96a3;"><p style="font-size:15px;">No family chats yet</p></div>
    <div id="content-channels" style="display:none; padding:40px 20px; text-align:center; color:#8e96a3;"><p style="font-size:15px;">No channels yet</p></div>
  </div>

  <!-- Bottom Nav -->
  <div style="position:fixed; bottom:0; left:0; right:0; background:#1a1f2e; border-top:1px solid #2a2f3e; display:flex; align-items:center; justify-content:space-around; padding:8px 0;">
    <button style="background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:8px 16px; color:#2a9ef1;">
      <div style="position:relative;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path opacity="0.5" d="M13.6288 20.4718L13.0867 21.3877C12.6035 22.204 11.3965 22.204 10.9133 21.3877L10.3712 20.4718C9.95073 19.7614 9.74049 19.4063 9.40279 19.2098C9.06509 19.0134 8.63992 19.0061 7.78958 18.9915C6.53422 18.9698 5.74689 18.8929 5.08658 18.6194C3.86144 18.1119 2.88807 17.1386 2.3806 15.9134C2 14.9946 2 13.8297 2 11.5V10.5C2 7.22657 2 5.58985 2.7368 4.38751C3.14908 3.71473 3.71473 3.14908 4.38751 2.7368C5.58985 2 7.22657 2 10.5 2H13.5C16.7734 2 18.4101 2 19.6125 2.7368C20.2853 3.14908 20.8509 3.71473 21.2632 4.38751C22 5.58985 22 7.22657 22 10.5V11.5C22 13.8297 22 14.9946 21.6194 15.9134C21.1119 17.1386 20.1386 18.1119 18.9134 18.6194C18.2531 18.8929 17.4658 18.9698 16.2104 18.9915C15.36 19.0061 14.9349 19.0134 14.5972 19.2098C14.2595 19.4062 14.0492 19.7614 13.6288 20.4718Z" fill="#2a9ef1"/>
          <path d="M17 11C17 11.5523 16.5523 12 16 12C15.4477 12 15 11.5523 15 11C15 10.4477 15.4477 10 16 10C16.5523 10 17 10.4477 17 11Z" fill="#2a9ef1"/>
          <path d="M13 11C13 11.5523 12.5523 12 12 12C11.4477 12 11 11.5523 11 11C11 10.4477 11.4477 10 12 10C12.5523 10 13 10.4477 13 11Z" fill="#2a9ef1"/>
          <path d="M9 11C9 11.5523 8.55228 12 8 12C7.44772 12 7 11.5523 7 11C7 10.4477 7.44772 10 8 10C8.55228 10 9 10.4477 9 11Z" fill="#2a9ef1"/>
        </svg>
        <div style="position:absolute; top:-4px; right:-6px; background:#ee5451; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:600; border:2px solid #1a1f2e;">6</div>
      </div>
      <span style="font-size:11px; font-weight:500;">Chats</span>
    </button>
    <button style="background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:8px 16px; color:#8e96a3;">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" style="margin-top:-8px;">
        <path fill="#8e96a3" d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0a4.125 4.125 0 0 1-8.25 0Zm9.75 2.25a3.375 3.375 0 1 1 6.75 0a3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63a13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122Zm15.75.003l-.001.144a2.25 2.25 0 0 1-.233.96a10.088 10.088 0 0 0 5.06-1.01a.75.75 0 0 0 .42-.643a4.875 4.875 0 0 0-6.957-4.611a8.586 8.586 0 0 1 1.71 5.157v.003Z"/>
      </svg>
      <span style="font-size:11px; font-weight:400;">Contacts</span>
    </button>
    <button style="background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:8px 16px; color:#8e96a3;">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
        <path fill="#8e96a3" fill-rule="evenodd" d="M256 42.667A213.333 213.333 0 0 1 469.334 256c0 117.821-95.513 213.334-213.334 213.334c-117.82 0-213.333-95.513-213.333-213.334C42.667 138.18 138.18 42.667 256 42.667m21.334 234.667h-42.667c-52.815 0-98.158 31.987-117.715 77.648c30.944 43.391 81.692 71.685 139.048 71.685s108.104-28.294 139.049-71.688c-19.557-45.658-64.9-77.645-117.715-77.645M256 106.667c-35.346 0-64 28.654-64 64s28.654 64 64 64s64-28.654 64-64s-28.653-64-64-64" clip-rule="evenodd"/>
      </svg>
      <span style="font-size:11px; font-weight:400;">Settings</span>
    </button>
  </div>

</div>
<!-- ═══════════════════════════════════ END SCREEN 1 ═══════════════════════════════════ -->


<!-- ═══════════════════════════════════ SCREEN 2: CHAT VIEW ═══════════════════════════════════ -->
<div id="screen-chat-view">

  <!-- Chat Header -->
  <div style="display:flex; align-items:center; padding:12px 8px 12px 4px; background:#1a1f2e; gap:4px;">
    <!-- Back arrow -->
    <button onclick="closeChat()" style="width:44px; height:44px; background:transparent; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8e96a3; flex-shrink:0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>

    <!-- Avatar -->
    <div style="width:42px; height:42px; border-radius:50%; background:#2a2f3e; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:2px dashed #3a4050;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a5060" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
      </svg>
    </div>

    <!-- Name + status -->
    <div style="flex:1; min-width:0; padding-left:10px;">
      <div style="font-size:17px; font-weight:600; color:#fff;">Арина Громова</div>
      <div style="font-size:13px; color:#8e96a3; margin-top:1px;">last seen recently</div>
    </div>

    <!-- Three dots menu -->
    <button style="width:44px; height:44px; background:transparent; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8e96a3; flex-shrink:0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Chat body (empty for now) -->
  <div style="flex:1; padding:20px; color:#8e96a3; text-align:center; margin-top:40px;">
    <p style="font-size:14px;">No messages yet</p>
  </div>

</div>
<!-- ═══════════════════════════════════ END SCREEN 2 ═══════════════════════════════════ -->


</div><!-- end #app -->
<script>
  const tabs = ['all', 'new', 'family', 'channels'];
  let current = 'all';

  function setTab(id) {
    document.getElementById('bar-' + current).style.display = 'none';
    document.getElementById('content-' + current).style.display = 'none';
    const oldLabel = document.getElementById('label-' + current);
    if (oldLabel) { oldLabel.style.color = '#8e96a3'; oldLabel.style.fontWeight = '400'; }

    current = id;
    document.getElementById('bar-' + current).style.display = 'block';
    document.getElementById('content-' + current).style.display = 'block';
    const newLabel = document.getElementById('label-' + current);
    if (newLabel) { newLabel.style.color = '#fff'; newLabel.style.fontWeight = '500'; }
  }

  function openChat() {
    const row = document.getElementById('chat-row');
    row.style.background = 'linear-gradient(135deg, #2c3e75 0%, #7a1f7a 100%)';
    
    setTimeout(() => { document.body.classList.add('in-chat'); }, 150);
  }

  function closeChat() {
    document.body.classList.remove('in-chat');
    document.getElementById('chat-row').removeAttribute('style');
    document.getElementById('chat-row').setAttribute('style', 'display:flex; align-items:center; padding:12px 20px; gap:14px; cursor:pointer; position:relative; transition: background 0.15s;');
  }


</script>
</body>
</html>
