<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in with QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #a8d8f0 0%, #c5e8f7 40%, #dff0fb 100%);
    }

    .card {
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(160deg, #f0f8ff 0%, #e8f4fd 50%, #dceefb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 40px;
      position: relative;
      overflow: hidden;
    }

    /* subtle dot pattern */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(100,170,220,0.18) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      pointer-events: none;
    }

    .qr-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 28px;
      z-index: 1;
    }

    #qrcode canvas,
    #qrcode img {
      width: 220px !important;
      height: 220px !important;
      display: block;
    }

    .qr-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 46px;
      background: white;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      text-align: center;
      margin-bottom: 10px;
      z-index: 1;
    }

    .subtitle {
      font-size: 13.5px;
      color: #888;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 40px;
      z-index: 1;
    }

    .divider {
      width: 100%;
      max-width: 280px;
      height: 1px;
      background: rgba(0,0,0,0.08);
      margin-bottom: 24px;
      z-index: 1;
    }

    .link-btn {
      background: none;
      border: none;
      color: #3a8fd4;
      font-size: 15.5px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 16px;
      z-index: 1;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .link-btn:last-child { margin-bottom: 0; }
    .link-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef } = React;

    function QRLoginPage() {
      const qrRef = useRef(null);

      useEffect(() => {
        if (qrRef.current && qrRef.current.innerHTML === "") {
          new QRCode(qrRef.current, {
            text: "https://your-app-login-link.com/qr-auth-token",
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H,
          });
        }
      }, []);

      return (
        <div className="card">
          <div className="qr-wrapper">
            <div ref={qrRef}></div>
            <div className="qr-center" />
          </div>

          <p className="title">Sign in to MAX via QR Code</p>
          <p className="subtitle">
            Point your camera at the QR code to sign in<br />
            to your profile or download the app
          </p>

          <div className="divider" />

          <a href="/phone-login" className="link-btn">Sign in with phone number</a>
          <a href="/help" className="link-btn">Need help?</a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<QRLoginPage />);
  </script>
</body>
</html>
