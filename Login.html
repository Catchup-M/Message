  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #a8d8f0 0%, #c5e8f7 40%, #dff0fb 100%);
      background-attachment: fixed;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    /* Fixed viewport — clips everything */
    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /*
      Track: a flex row of [login-page | country-panel]
      Each child is 100vw wide, so the track is 200vw total.
      When panel opens, we slide the track left by 100vw —
      the login page disappears left, the gradient behind it is exposed,
      and the country panel slides in from the right.
    */
    .track {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track.open {
      transform: translateX(-50%);
    }

    /* Login page — left half of the track = full viewport width */
    .login-page {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      flex-shrink: 0;
    }

    /* Country panel — right half of the track = full viewport width */
    .country-panel {
      width: 50%;
      height: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
  </style>
</head>

    const ACCENT = "#1a1a2e";

    function PhoneLogin() {
      const [phone, setPhone] = useState("");

          c.name.toLowerCase().includes(search.toLowerCase()) ||
          c.code.includes(search)
        ), [search]);

                    type="tel"
                    placeholder="123 456-7890"
                    value={phone}
                    onChange={e => setPhone(e.target.value.replace(/[^\d\s\-]/g, ""))}
                    onFocus={() => setFocused(true)}
                    onBlur={() => setFocused(false)}
                    style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#111", fontSize: 16, caretColor: "#111" }}
                  />
                </div>

                  onClick={() => phone.trim() && alert(`Code sent to ${selectedCountry.code} ${phone}`)}
                  style={{ width: "100%", height: 50, borderRadius: 12, border: "none", background: phone.trim() ? ACCENT : "rgba(0,0,0,0.08)", color: phone.trim() ? "white" : "rgba(0,0,0,0.3)", fontSize: 16, fontWeight: 600, cursor: phone.trim() ? "pointer" : "default", marginBottom: 20, transition: "all 0.25s" }}

                    <path d="M11 11l3 3" stroke="rgba(0,0,0,0.35)" strokeWidth="1.5" strokeLinecap="round" />
                  </svg>
                  <input

                    placeholder="Country or code"
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#111", fontSize: 13, caretColor: "#111" }}

                    <span style={{ color: "rgba(0,0,0,0.4)", fontSize: 15 }}>{c.code}</span>
                  </div>
                ))}
