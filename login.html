      const [phone, setPhone] = useState("");

      const [panelOpen, setPanelOpen] = useState(false);

          c.name.toLowerCase().includes(search.toLowerCase()) ||
          c.code.includes(search)
        ), [search]);

                <span style={{ color: "white", fontSize: 15 }}>{selectedCountry.code}</span>

                  <path d="M1 3l4 4 4-4" stroke="#aaa" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </div>
              <div style={{ width: 1, height: 20, background: "rgba(255,255,255,0.15)" }} />
              <input
                type="tel"
                placeholder="123 456-7890"
                value={phone}
                onChange={e => setPhone(e.target.value.replace(/[^\d\s\-]/g, ""))}
                onFocus={() => setFocused(true)}
                onBlur={() => setFocused(false)}
                style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "white", fontSize: 16, caretColor: "white" }}
              />
            </div>

            {/* Continue button */}
            <button
              onClick={() => phone.trim() && alert(`Code sent to ${selectedCountry.code} ${phone}`)}
              style={{ width: "100%", height: 50, borderRadius: 12, border: "none", background: phone.trim() ? ACCENT : "rgba(255,255,255,0.08)", color: phone.trim() ? "white" : "rgba(255,255,255,0.3)", fontSize: 16, fontWeight: 600, cursor: phone.trim() ? "pointer" : "default", marginBottom: 20, boxShadow: phone.trim() ? `0 6px 20px ${ACCENT}99` : "none", transition: "all 0.25s" }}
            >
              Continue
            </button>

            <p style={{ color: "rgba(255,255,255,0.28)", fontSize: 11.5, textAlign: "center", lineHeight: 1.6, margin: 0 }}>

              <a href="#" style={{ color: "rgba(255,255,255,0.6)", textDecoration: "underline" }}>Privacy Policy</a>
              {" "}and{" "}
              <a href="#" style={{ color: "rgba(255,255,255,0.6)", textDecoration: "underline" }}>Terms of Service</a>
            </p>
          </div>

          {/* Overlay */}
          {panelOpen && <div onClick={() => setPanelOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 10 }} />}

          {/* Slide-in country panel */}
          <div style={{ position: "fixed", top: 0, right: panelOpen ? 0 : "-100%", width: "100%", height: "100%", background: BG, zIndex: 20, display: "flex", flexDirection: "column", transition: "right 0.35s cubic-bezier(0.4,0,0.2,1)" }}>

            {/* Panel header */}
            <div style={{ display: "flex", alignItems: "center", padding: "14px 14px 10px", gap: 8, borderBottom: "1px solid rgba(255,255,255,0.06)" }}>

                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                  <circle cx="7" cy="7" r="5" stroke="rgba(255,255,255,0.4)" strokeWidth="1.5" />
                  <path d="M11 11l3 3" stroke="rgba(255,255,255,0.4)" strokeWidth="1.5" strokeLinecap="round" />
                </svg>
                <input
                  type="text"
                  placeholder="Country or code"
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "white", fontSize: 13, caretColor: "white" }}
                />
              </div>
              {/* X button */}
              <button onClick={() => setPanelOpen(false)} style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "50%", width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M1 1l10 10M11 1L1 11" stroke="white" strokeWidth="1.8" strokeLinecap="round" />
                </svg>
              </button>
            </div>

            {/* Country list */}
            <div style={{ flex: 1, overflowY: "auto", padding: "8px 0" }}>
              {filtered.map((c, i) => (
                <div key={i} onClick={() => { setSelectedCountry(c); setPanelOpen(false); }} style={{ display: "flex", alignItems: "center", padding: "14px 20px", cursor: "pointer", borderBottom: "1px solid rgba(255,255,255,0.04)", background: c.name === selectedCountry.name ? ACCENT : "transparent" }}>

                  <span style={{ color: "rgba(255,255,255,0.4)", fontSize: 15 }}>{c.code}</span>
                </div>
